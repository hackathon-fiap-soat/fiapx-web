# Análise no SonarCloud (Etapa 8, spec §11.2): o CI roda o scanner depois dos testes e espera o Quality Gate.
sonar.organization=hackathon-fiap-soat
sonar.projectKey=hackathon-fiap-soat_fiapx-web
sonar.projectName=fiapx-web
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8
sonar.sources=src
sonar.tests=src,e2e,e2e-local
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx,e2e/**,e2e-local/**
sonar.exclusions=src/**/*.test.ts,src/**/*.test.tsx,src/test/**,src/mocks/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
