name: ci

# Checks de todo PR (spec §11.2): ESLint, typecheck, Vitest com cobertura ≥ 80%, build, E2E com Playwright
# contra o modo mock (MSW), build da imagem + Trivy, kustomize + kubeconform, terraform fmt/validate e
# actionlint. O deploy está em deploy.yml (ADR-018, credenciais da AWS Academy, ADR-019).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Vitest com cobertura ≥ 80%
        run: npm run test:coverage
      - name: Build de produção
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Chromium do Playwright
        run: npx playwright install --with-deps chromium
      - name: E2E (login → upload → status) contra o modo mock
        run: npm run test:e2e
      - name: Relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  imagem:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build da imagem de produção (linux/amd64)
        run: docker build --platform linux/amd64 -t fiapx-web:${{ github.sha }} .
      - name: Smoke da imagem (/, rota do SPA e /api fora do nginx)
        run: |
          set -euo pipefail
          docker run -d --name web --read-only --tmpfs /tmp -p 8080:8080 fiapx-web:${{ github.sha }}
          for _ in $(seq 1 20); do curl -fs http://localhost:8080/ >/dev/null && break; sleep 1; done
          for rota in / /login /videos; do
            curl -fsS "http://localhost:8080$rota" | grep -q 'id="root"' || { echo "::error::$rota não devolveu o index.html"; exit 1; }
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/videos)" = 404
          docker rm -f web
      - name: Trivy (falha em CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: fiapx-web:${{ github.sha }}
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: kustomize build + kubeconform
        run: |
          cp k8s/overlays/prod/aws.env.example k8s/overlays/prod/aws.env
          docker run --rm -v "$PWD/k8s":/k8s registry.k8s.io/kustomize/kustomize:v5.6.0 build /k8s/overlays/prod > manifests.yaml
          docker run --rm -v "$PWD":/w ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary -ignore-missing-schemas -kubernetes-version 1.33.0 /w/manifests.yaml

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.15.8 }
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        run: docker run --rm -v "$PWD":/repo -w /repo rhysd/actionlint:1.7.7 -color
