# Site estático do fiapx-web (SPA). Porta 8080 (imagem não root). Em produção o ALB manda /api/* para o
# fiapx-video-api e o resto para cá (ADR-019): este nginx não faz proxy da API.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Assets com hash no nome (build do Vite): cache longo.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # /api/* nunca deve chegar aqui; se chegar, 404 em JSON em vez do index.html.
    location /api/ {
        default_type application/json;
        return 404 '{"message":"Not Found"}';
    }

    # index.html e rotas do SPA (fallback): sempre revalidar, para um deploy novo valer na hora.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
